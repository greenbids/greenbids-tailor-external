apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "greenbids-tailor.fullname" . }}
  labels:
    {{- include "greenbids-tailor.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "greenbids-tailor.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "greenbids-tailor.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: OTEL_EXPORTER_PROMETHEUS_ENABLED
              value: {{ .Values.otelExporterPrometheus.enabled | quote }}
            - name: OTEL_EXPORTER_PROMETHEUS_PORT
              value: {{ .Values.otelExporterPrometheus.targetPort | quote }}
            {{- $headers := .Values.otel.exporterOtlpHeaders | default "" }}
            {{- if .Values.otel.auth.enabled }}
            {{- $auth := "Authorization=Bearer $(OTEL_AUTH_TOKEN)" }}
            {{- $headers = ternary (printf "%s,%s" $headers $auth) $auth (ne $headers "") }}
            - name: OTEL_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "otel.auth.secretName is required when otel.auth.enabled is true" .Values.otel.auth.secretName }}
                  key: {{ .Values.otel.auth.secretKey | quote }}
            {{- end }}
            {{- if $headers }}
            - name: OTEL_EXPORTER_OTLP_HEADERS
              value: {{ $headers | quote }}
            {{- end }}
          {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            {{- if .Values.otelExporterPrometheus.enabled }}
            - name: prom
              containerPort: {{ .Values.otelExporterPrometheus.port }}
              protocol: TCP
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
