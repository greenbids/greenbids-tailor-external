# Default values for greenbids-tailor.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ghcr.io/greenbids/tailor
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 8000
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 1000m
    memory: 512Mi

startupProbe:
  httpGet:
    path: /healthz/startup
    port: http
livenessProbe:
  httpGet:
    path: /healthz/liveness
    port: http
readinessProbe:
  httpGet:
    path: /healthz/readiness
    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80
  # behavior: 
  #   scaleDown:
  #     stabilizationWindowSeconds: 86400

nodeSelector: {}

tolerations: []

affinity: {}

env:
  - name: WEB_CONCURRENCY
    value: "1"

envFrom: []

otelExporterPrometheus:
  enabled: false
  port: 9464
  targetPort: 9464

otel:
  # Base OTLP headers sent with every export (comma-separated key=value pairs).
  # Mirrors the image default; leave empty to fall back to the image's value.
  exporterOtlpHeaders: "Greenbids-Tailor=true"
  auth:
    # When enabled, a bearer token is read from an existing Secret and appended
    # to OTEL_EXPORTER_OTLP_HEADERS as `Authorization=Bearer <token>`.
    enabled: false
    # Name of an existing Secret holding the token (required when enabled).
    secretName: ""
    # Key within the Secret that contains the raw token value.
    secretKey: token
